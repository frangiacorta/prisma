<!doctype html>
<html lang="it" data-release="0049c9863913">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Prisma · Confronti visivi</title>
 <style>
  :root{color-scheme:dark;font:15px/1.5 system-ui,sans-serif;background:#101114;color:#efeff1}
  body{width:min(1120px,calc(100% - 32px));margin:24px auto 60px}
  h1{margin:12px 0 6px;font-size:clamp(1.7rem,4vw,2.55rem)}h2{font-size:1.12rem}
  nav{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 22px}
  main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:16px}
  article{background:#17191f;border:1px solid #31343a;border-radius:10px;overflow:hidden;scroll-margin-top:14px}
  article:target{outline:2px solid #bfdf9c}
  article div{padding:4px 15px 16px}article video{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;background:#070809}
  a{color:#ccedac;text-underline-offset:3px}p{color:#c0c4ca;margin:4px 0 12px}
 </style>
</head>
<body>
 <h1>Confronti visivi</h1>
 <nav><a href="../">Prisma</a><a href="../moodboard/?view=roadmap">Moodboard</a></nav>
 <p id="loading" role="status">Carico i confronti…</p>
 <main aria-label="Studi e fonti"></main>
 <script type="module">
  const grid=document.querySelector('main'),loading=document.getElementById('loading');
  const cssSafe=/^[a-z0-9-]+$/;
  const revision=document.documentElement.dataset.release;
  const asset=name=>revision?name+'?v='+revision:name;
  const text=(tag,value)=>{const node=document.createElement(tag);node.textContent=value;return node;};
  const link=(label,url)=>{const a=text('a',label);a.href=url;return a;};
  const outcomes={raggiunto:'Raggiunto',vicino:'Vicino',parziale:'Parziale',lontano:'Scarto ampio',fonte:'Fonte esterna',funzionale:'Verifica funzionale'};
  try{
   const data=await fetch(asset('../moodboard/data.json'),{cache:'no-cache'}).then(response=>{if(!response.ok)throw Error();return response.json();});
   const rendered=new Set();
   for(const item of data.items.filter(item=>item.kind==='project'&&item.comparisonDate&&item.resultPreset)){
    const slug=item.resultPreset.match(/^previews\/([a-z0-9-]+)\.prisma\.json$/)?.[1];
    if(!cssSafe.test(slug||'')||rendered.has(slug))continue;
    rendered.add(slug);
    const article=document.createElement('article');article.id=slug;
    const video=document.createElement('video');video.controls=true;video.muted=true;video.playsInline=true;video.preload='none';video.setAttribute('aria-label',item.name);
    video.src=asset(slug+'.mp4');video.poster=asset(slug+'.webp');
    const body=document.createElement('div'),heading=text('h2',item.name),note=text('p',item.compareNote||'');
    body.append(heading,text('small',outcomes[item.comparisonOutcome]||'Verifica'),note,link('Apri preset','../?preset='+encodeURIComponent(item.resultPreset)),
     document.createTextNode(' · '),link('Confronta nella moodboard','../moodboard/#'+encodeURIComponent(item.id)));
    article.append(video,body);grid.append(article);
   }
   loading.hidden=true;
   document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
  }catch{loading.textContent='I confronti non sono disponibili. Ricarica la pagina per riprovare.';}
 </script>
</body>
</html>
